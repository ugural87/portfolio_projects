name: TCMB PolicyRAG CI

on:
  push:
    paths:
      - "GenAI/tcmb-policyrag/**"
      - ".github/workflows/tcmb-policyrag.yml"
  pull_request:
    paths:
      - "GenAI/tcmb-policyrag/**"
      - ".github/workflows/tcmb-policyrag.yml"
  workflow_dispatch:

concurrency:
  group: tcmb-policyrag-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: GenAI/tcmb-policyrag

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: GenAI/tcmb-policyrag/pyproject.toml
      - run: pip install -c constraints/typecheck.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=tcmb_policyrag --cov-report=term-missing
      - name: Verify reproducible corpus snapshot
        if: matrix.python-version == '3.12'
        run: |
          make merge
          git diff --exit-code -- data/raw

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: GenAI/tcmb-policyrag/pyproject.toml
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: tcmb-policyrag-package
          path: GenAI/tcmb-policyrag/dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag tcmb-policyrag:ci .
