name: NYC Taxi CI

on:
  pull_request:
    paths:
      - "MLOps/NYC_Taxi_Duration_Production_ML/**"
      - ".github/workflows/nyc-taxi-ci.yml"
  push:
    branches: [main]
    paths:
      - "MLOps/NYC_Taxi_Duration_Production_ML/**"
      - ".github/workflows/nyc-taxi-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: MLOps/NYC_Taxi_Duration_Production_ML

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MLOps/NYC_Taxi_Duration_Production_ML/requirements-dev.lock

      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit -r requirements-dev.lock

  container:
    runs-on: ubuntu-24.04
    needs: quality

    defaults:
      run:
        working-directory: MLOps/NYC_Taxi_Duration_Production_ML

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MLOps/NYC_Taxi_Duration_Production_ML/requirements.lock

      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python scripts/generate_sample_data.py --rows 1000
      - run: taxi-ml train data/raw/sample.parquet --model-version ci-smoke

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: MLOps/NYC_Taxi_Duration_Production_ML
          push: false
          load: true
          tags: nyc-taxi-duration:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nyc-taxi-duration:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Container smoke test
        run: |
          docker run -d \
            --name api \
            -p 8000:8000 \
            -e TAXI_CONFIG_PATH=/app/configs/development.yaml \
            nyc-taxi-duration:ci

          for i in $(seq 1 30); do
            curl -sf localhost:8000/health/ready && break
            sleep 1
          done

          ./scripts/smoke_test.sh http://localhost:8000
