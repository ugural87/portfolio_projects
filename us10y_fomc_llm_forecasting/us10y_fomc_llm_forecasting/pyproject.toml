[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us10y-fomc-fusion"
version = "0.1.2"
description = "Leakage-audited Treasury CNN-Transformer and FOMC minutes cross-attention research pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4>=4.12",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openai>=1.100",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
  "tiktoken>=0.8",
  "torch>=2.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["jupyter>=1.1", "nbformat>=5.10", "pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
