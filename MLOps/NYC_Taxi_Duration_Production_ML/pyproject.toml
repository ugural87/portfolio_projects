[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nyc-taxi-duration-mlops"
version = "1.2.3"
description = "Production-oriented NYC yellow taxi trip-duration regression system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Ugur Alkan"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "pyarrow>=23,<24",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<1.7",
  "structlog>=24.4,<26",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
docs = ["reportlab>=4.2,<5"]
tracking = ["mlflow>=2.17,<3"]
dev = [
  "bandit[toml]>=1.7,<2",
  "mypy>=1.12,<2",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0",
]

[project.scripts]
taxi-ml = "taxi_duration.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_duration"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=taxi_duration --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
markers = ["integration: tests crossing component boundaries"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools/generate_pdf.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
