name: Gated retraining and deployment
on:
  workflow_dispatch:
    inputs:
      year: {description: "TLC data year (blank = automatic lagged month)", required: false, type: string}
      month: {description: "TLC data month, 1-12 (blank = automatic)", required: false, type: string}
      skip_champion:
        description: "Skip champion comparison (first release or deliberate runtime upgrade)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 6 15 * *"
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: model-production-deploy
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nyc-taxi-duration" >> "$GITHUB_OUTPUT"
      - name: Resolve data period
        id: period
        # Zero-padding happens in one place (Python), so manual "1" and "01" resolve identically.
        run: taxi-ml resolve-period --year "${{ inputs.year }}" --month "${{ inputs.month }}" >> "$GITHUB_OUTPUT"
      - name: Download rolling training window
        run: |
          IFS=',' read -ra PERIODS <<< "${{ steps.period.outputs.window }}"
          for period in "${PERIODS[@]}"; do
            taxi-ml download "${period%-*}" "${period#*-}" --config-path configs/staging.yaml
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch production champion
        id: champion
        if: ${{ !inputs.skip_champion }}
        run: |
          image="${{ steps.image.outputs.name }}:production"
          docker pull "$image"
          cid=$(docker create "$image")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p champion
          docker cp "$cid:/app/artifacts/model.joblib" champion/model.joblib
          docker cp "$cid:/app/artifacts/metadata.json" champion/metadata.json
          test -s champion/model.joblib
          test -s champion/metadata.json
          echo "args=--champion-model-path champion/model.joblib --champion-metadata-path champion/metadata.json" >> "$GITHUB_OUTPUT"
      - name: Train and enforce release gates
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          IFS=',' read -ra PERIODS <<< "${{ steps.period.outputs.window }}"
          DATA_PATHS=()
          for period in "${PERIODS[@]}"; do
            DATA_PATHS+=("data/raw/yellow_tripdata_${period}.parquet")
          done
          taxi-ml train "${DATA_PATHS[@]}" \
            --config-path configs/staging.yaml \
            --model-version ${{ steps.period.outputs.period }}-${{ github.run_id }} \
            ${{ steps.champion.outputs.args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: model-candidate-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}
          provenance: true
          sbom: true
  staging:
    runs-on: ubuntu-latest
    needs: candidate
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with: {kustomize-version: "5.6.0"}
      # Cluster credentials (OIDC / scoped deploy integration) must be configured here.
      - name: Deploy gated digest to staging
        working-directory: k8s/overlays/staging
        run: |
          kustomize edit set image taxi-duration-api=${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
          kubectl apply -k .
          kubectl -n taxi-staging rollout status deployment/taxi-duration-api --timeout=180s
      - run: ./scripts/smoke_test.sh "${{ vars.STAGING_BASE_URL }}"
  production:
    runs-on: ubuntu-latest
    needs: [candidate, staging]
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with: {kustomize-version: "5.6.0"}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Apply the exact staging digest
        id: production_apply
        working-directory: k8s/overlays/production
        run: |
          kustomize edit set image taxi-duration-api=${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
          kubectl apply -k .
      - name: Wait for production rollout
        run: |
          kubectl -n taxi-production rollout status deployment/taxi-duration-api --timeout=300s
      - run: ./scripts/smoke_test.sh "${{ vars.PRODUCTION_BASE_URL }}"
      - name: Record new champion
        # The moving `production` tag is what the next retraining run compares against.
        run: |
          docker buildx imagetools create \
            --tag ${{ needs.candidate.outputs.image }}:production \
            ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
      - name: Roll back on failure
        if: ${{ failure() && steps.production_apply.outcome == 'success' }}
        run: kubectl -n taxi-production rollout undo deployment/taxi-duration-api
