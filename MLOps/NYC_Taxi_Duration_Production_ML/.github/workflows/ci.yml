name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit -r requirements-dev.lock
  container:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python scripts/generate_sample_data.py --rows 1000
      - run: taxi-ml train data/raw/sample.parquet --model-version ci-smoke
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: nyc-taxi-duration:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: nyc-taxi-duration:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Container smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e TAXI_CONFIG_PATH=/app/configs/development.yaml nyc-taxi-duration:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health/ready && break; sleep 1; done
          ./scripts/smoke_test.sh http://localhost:8000
