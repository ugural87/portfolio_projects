name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints/typecheck.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: |
          make merge
          git diff --exit-code -- data/raw
      - run: pip install build
      - run: python -m build
      - name: Build complete repository archive
        run: |
          git archive \
            --format=zip \
            --prefix="tcmb-policyrag-${GITHUB_REF_NAME}/" \
            --output="dist/TCMB_PolicyRAG_Full_Repo_${GITHUB_REF_NAME}.zip" \
            HEAD
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
