[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-decision-system"
version = "1.0.0"
description = "Leakage-resistant fraud prediction, decision economics and semi-synthetic causal policy evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Ugur Alkan"}]
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.13,<2.0",
  "scikit-learn>=1.7,<1.9",
  "imbalanced-learn>=0.14,<0.15",
  "xgboost>=3.0,<4.0",
  "lightgbm>=4.6,<5.0",
  "torch>=2.7,<3.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<0.14",
  "joblib>=1.4,<2.0"
]

[project.optional-dependencies]
dev = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
